[build]
  functions = "netlify/functions"
  # Bakes reviews and gallery captions into the HTML so non-JS crawlers (AI search, etc.) can read them.
  command = "node scripts/prerender-static.mjs"

[build.environment]
  NODE_VERSION = "20"

# Stray copy of the homepage; send it to the real homepage so it isn't indexed as a duplicate.
[[redirects]]
  from = "/index (2).html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index (2)"
  to = "/"
  status = 301
  force = true

# Plain-text site summary for AI assistants and search tools.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
